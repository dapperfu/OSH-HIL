; @relation(SSS-001, scope=file)
; @relation(SDD-002, scope=file)

[platformio]
default_envs = read_d2_d5

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = feilipu/FreeRTOS@11.1.0-3
extra_scripts = pre:../firmware/enable_static_freertos.py
build_flags =
    -DNANO4I4O_BAUD=115200

[env:read_d2_d5]
build_flags =
    ${env.build_flags}
    -DNANO4I4O_ROLE_READ=1

[env:drive_walk]
build_flags =
    ${env.build_flags}
    -DNANO4I4O_ROLE_DRIVE=1
